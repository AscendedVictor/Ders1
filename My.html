<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="always">
    <link rel="icon" type="image/png" href="img/arcane/arcane.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
            padding: 30px 0;
        }
        .logo {
            max-width: 40%;
            margin-bottom: 50px;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .char-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .char-card {
            position: relative;
            width: 220px;
            height: 320px;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #333;
            cursor: pointer;
        }

        .char-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .char-card:hover img {
            transform: scale(1.08);
            filter: brightness(0.4);
        }

        .char-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .char-card:hover .char-info {
            opacity: 1;
            transform: translateY(0);
        }

        .char-info h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <img src="img/arcane/arcane.png" alt="Arcane Logo" class="logo">

    <div class="char-container">

        <div class="char-card">
            <img src="img/vi.jpg" alt="Vi">
            <div class="char-info">
                <h2>Vi</h2>
            </div>
        </div>

        <div class="char-card">
            <img src="img/arcane/arcane.png" alt="Jinx">
            <div class="char-info">
                <h2>Jinx</h2>
            </div>
        </div>

    </div>

</body>
</html>
